{% extends 'shop/base.html' %}{% block content %}<section class="form-card wide"><p class="kicker">ALMOST YOURS</p><h1>Delivery details</h1><p>Order total: <b>₹{{ total }}</b></p><form method="post">{% csrf_token %}<label>Full name<input name="full_name" required value="{{ user.get_full_name }}"></label><label>Email address<input type="email" name="email" required value="{{ user.email }}"></label><label>Phone number<input name="phone" required></label><label>Address<textarea name="address" required></textarea></label><label>City<input name="city" required></label><label>PIN code<input name="pincode" required></label><label>Payment method<select name="payment_method"><option value="COD">Cash on Delivery</option></select></label><button class="button">PLACE DEMO ORDER</button></form><p class="hint">This starter version supports Cash on Delivery demo orders only. No real payment is collected.</p></section>{% endblock %}
